name: Build Release APK
on:
  workflow_dispatch:
    inputs:
      major_version:
        description: 'Major Release version'
        required: true
      minor_version:
        description: 'Minor Release version'
        required: true

permissions: 
  contents: write

jobs:
  build:
    runs-on: 'ubuntu-26.04'

    steps:
      - uses: actions/checkout@v4

      - name: Make JKS file
        env: 
          TEMP_FOLDER: ${{ runner.temp }}
          JKS_DATA: ${{ secrets.BASE64_JKS_FILE }}
        run: |
          echo "$JKS_DATA" | base64 --decode > "$TEMP_FOLDER/trakker.jks"

      - name: Setup java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Build APK
        env:
          KEYFILE_PATH: ${{ runner.temp }}/trakker.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          major_version: ${{ inputs.major_version }}
          minor_version: ${{ inputs.minor_version }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYFILE_PATH" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Rename APK
        env:
          LOCATION: app/build/outputs/apk/release
          OLD_APP_NAME: app-release.apk
          NEW_APP_NAME: trakker_${{ inputs.major_version }}_${{ inputs.minor_version }}.apk
        run: |
          mv $LOCATION/$OLD_APP_NAME $LOCATION/$NEW_APP_NAME 
      
      - name: Release
        uses: softprops/action-gh-release@v3
        env:
          VERSION: ${{ inputs.major_version }}.${{ inputs.minor_version }}
          APK_NAME: trakker_${{ inputs.major_version }}_${{ inputs.minor_version }}.apk
        with:
          tag_name: v${{ env.VERSION }}
          name: Trakker ${{ env.VERSION }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: app/build/outputs/apk/release/${{ env.APK_NAME }}
